<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta property="og:title" content="Your Website Title Here">
    <meta property="og:description" content="Join our premium online learning platform and upgrade your skills today.">
    <meta property="og:image" content="https://yourwebsite.com/asset/preview-image.jpg">
    <meta property="og:url" content="https://yourwebsite.com">
    <meta property="og:type" content="website">
    <meta name="description"
        content="Join our premium online learning platform. Access interactive courses, live community zones, and expert tutors to upgrade your skills today.">
    <link rel="icon" type="image/png" href="./asset/logo_Favicon.webp">
    <title>404 - Stealth Mode | Startup Incubator</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --primary: #8a2be2;
            --secondary: #00e5ff;
            --bg-dark: #0a0b10;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --glass-bg: rgba(15, 17, 26, 0.75);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }


        .radar-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            height: 800px;
            border-radius: 50%;
            border: 1px solid rgba(0, 229, 255, 0.1);
            z-index: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .radar-container::before,
        .radar-container::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(0, 229, 255, 0.05);
        }

        .radar-container::before {
            width: 500px;
            height: 500px;
        }

        .radar-container::after {
            width: 250px;
            height: 250px;
        }

        .radar-sweep {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 70%, rgba(0, 229, 255, 0.15) 100%);
            animation: radarSpin 4s linear infinite;
        }

        @keyframes radarSpin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }


        .error-card {
            position: relative;
            z-index: 10;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-top: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 24px;
            padding: 60px 40px;
            text-align: center;
            max-width: 550px;
            width: 90%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.8s ease-out forwards;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        .glitch-text {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 8rem;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 10px;
            color: transparent;
            -webkit-text-stroke: 2px var(--secondary);
            text-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
            position: relative;
            display: inline-block;
        }

        .glitch-text::before,
        .glitch-text::after {
            content: '404';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            color: var(--secondary);
            -webkit-text-stroke: 0px;
            opacity: 0.8;
        }

        .glitch-text::before {
            left: 3px;
            text-shadow: -2px 0 var(--primary);
            animation: glitch-anim-1 2s infinite linear alternate-reverse;
        }

        .glitch-text::after {
            left: -3px;
            text-shadow: 2px 0 #ff00ea;
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim-1 {
            0% {
                clip-path: inset(20% 0 80% 0);
            }

            20% {
                clip-path: inset(60% 0 10% 0);
            }

            40% {
                clip-path: inset(40% 0 50% 0);
            }

            60% {
                clip-path: inset(80% 0 5% 0);
            }

            80% {
                clip-path: inset(10% 0 70% 0);
            }

            100% {
                clip-path: inset(30% 0 50% 0);
            }
        }

        @keyframes glitch-anim-2 {
            0% {
                clip-path: inset(10% 0 60% 0);
            }

            20% {
                clip-path: inset(30% 0 20% 0);
            }

            40% {
                clip-path: inset(70% 0 10% 0);
            }

            60% {
                clip-path: inset(20% 0 50% 0);
            }

            80% {
                clip-path: inset(50% 0 30% 0);
            }

            100% {
                clip-path: inset(5% 0 80% 0);
            }
        }


        h2 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: #fff;
            letter-spacing: 1px;
        }

        p {
            color: var(--text-muted);
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 35px;
        }


        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 28px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 180px;
            justify-content: center;
        }

        .btn-primary {
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            color: #fff;
            border: none;
        }

        .btn-primary:hover {
            box-shadow: 0 10px 25px rgba(0, 229, 255, 0.4);
            transform: translateY(-3px);
        }

        .btn-outline {
            background: rgba(255, 255, 255, 0.05);
            color: var(--secondary);
            border: 1px solid rgba(0, 229, 255, 0.3);
        }

        .btn-outline:hover {
            background: rgba(0, 229, 255, 0.1);
            border-color: var(--secondary);
            transform: translateY(-3px);
        }


        @media (max-width: 768px) {
            .radar-container {
                width: 150vw;
                height: 150vw;
            }

            .radar-container::before {
                width: 100vw;
                height: 100vw;
            }

            .radar-container::after {
                width: 50vw;
                height: 50vw;
            }

            .error-card {
                padding: 40px 20px;
            }

            .glitch-text {
                font-size: 5.5rem;
            }

            h2 {
                font-size: 1.4rem;
            }

            p {
                font-size: 0.95rem;
            }

            .btn-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>


    <div class="radar-container">
        <div class="radar-sweep"></div>
    </div>


    <div class="error-card">
        <div class="glitch-text">404</div>
        <h2>Idea in Stealth Mode 🕵️‍♂️</h2>
        <p>We scanned our entire incubator network, but this page is flying under the radar. It might be deleted, moved,
            or hasn't hatched yet.</p>

        <div class="btn-group">
            <a href="javascript:history.back()" class="btn btn-outline">
                <span>&#8592;</span> Go Back
            </a>
            <a href="index.html" class="btn btn-primary">
                Return to Base
            </a>
        </div>
    </div>

</body>

</html>
